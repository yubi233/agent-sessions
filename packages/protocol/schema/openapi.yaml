openapi: 3.1.0
info:
  title: Agent Sessions Internal API
  version: 1.0.0-draft
  description: 仅官方客户端使用的内部版本化 API。服务器只处理密文与白名单元数据。
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 进程存活
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: SQLite 可读写
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: not ready
  /v1/auth/register:
    post:
      operationId: register
      description: 兼容旧客户端的账号式初始 owner 注册；Android Happy 主路径应使用 device-bootstrap。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBoundTokenPair"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/device-bootstrap:
    post:
      operationId: deviceBootstrap
      description: Android/Happy 首次启动时用本机设备公钥直接初始化首个 owner，不要求账号、邮箱或密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRestoreResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/login:
    post:
      operationId: login
      description: 密码只校验账号；省略 device_role 时签发未绑定的 Web 只读令牌，禁止声明 Android 写身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices:
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/{id}/identity-keys:
    post:
      operationId: registerTerminalIdentityKey
      description: 仅 android_owner 可为 terminal 登记签名公钥并进入轮换双读窗口（ADR-012）；同一公钥重复登记幂等返回既有 key，已 retired 的公钥禁止复用。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalIdentityKeyRequest"
      responses:
        "201":
          description: registered key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalIdentityKeyView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listTerminalIdentityKeys
      description: 返回 terminal 登记密钥的脱敏审计视图；不返回公钥材料。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: registered keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalIdentityKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/devices/{id}/identity-keys/{keyId}:
    delete:
      operationId: revokeTerminalIdentityKey
      description: 立即撤销一把登记密钥；后续使用该 key 的签名一律 KEY_UNKNOWN_OR_REVOKED。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/devices/{id}:
    delete:
      operationId: revokeDevice
      description: 仅 android_owner 可撤销设备；被撤销设备的 bearer 与 refresh 均立即失效。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/bootstrap:
    post:
      operationId: bootstrapOwner
      description: 仅初始 android_owner 可写入一次本机公钥。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: owner device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests:
    post:
      operationId: createPairing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCreateRequest"
      responses:
        "201":
          description: pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/pairing/requests/{id}:
    get:
      operationId: getPairing
      description: 仅当前 Android owner 可读取；响应包含待配对设备的公开身份和加密密钥。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/requests/{id}/approve:
    post:
      operationId: approvePairing
      description: 仅 android_owner 可批准；重复批准幂等，并发批准只创建一台设备。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests/{id}/cancel:
    post:
      operationId: cancelPairing
      description: 仅当前 Android owner 可取消待处理配对请求。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/recovery-codes:
    post:
      operationId: generateRecoveryCode
      description: 仅 android_owner 可生成；恢复码明文只在此响应返回一次。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: recovery code shown once to the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/recovery-codes/restore:
    post:
      operationId: restoreRecoveryCode
      description: 无 bearer 恢复入口；恢复码一次性消费且限次，成功后撤销既有 Android 写设备。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRestoreRequest"
      responses:
        "200":
          description: recovered owner device and a new device-bound token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/terminals:
    get:
      operationId: listTerminals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: terminals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/audit:
    get:
      operationId: listAudit
      description: 账号脱敏审计分页（Admin 只读），limit 上限 100。
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: redacted audit entries
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items:
                      type: object
                      required: [id, action]
                      properties:
                        id:
                          type: integer
                        action:
                          type: string
                        metadata:
                          type: string
  /v1/usage/summary:
    get:
      operationId: usageSummary
      description: 账号在最近 1/7/30 天（UTC 日桶）的白名单用量聚合（ADR-010）。
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 7, 30]
            default: 30
      responses:
        "200":
          description: usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/daemon/usage/events:
    post:
      operationId: uploadUsageEvent
      description: 已配对 Terminal 上传单条白名单 usage 事件；usage_key 哈希去重，重复上传返回同一回执。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUsageEventRequest"
      responses:
        "200":
          description: usage event receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects:
    get:
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWorkspace
      description: 仅 android_owner/android 写控制端可登记 Workspace。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/create-with-folder:
    post:
      operationId: createWorkspaceWithFolder
      description: 仅 Android owner/write 控制端提交工作区名称；Relay 通过 workspace.create 命令要求在线 Terminal 在本机授权根的直接子目录创建 Git 工作区。响应不包含 canonical_root。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceWithFolderRequest"
      responses:
        "200":
          description: workspace already created or idempotent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreateResponse"
        "202":
          description: workspace.create command accepted and awaiting daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/create-with-folder/{commandID}:
    get:
      operationId: getWorkspaceCreateWithFolder
      description: 读取同账号 workspace.create 的脱敏状态；不返回命令 payload、Terminal ID 或 canonical_root。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: commandID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: workspace creation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions:
    get:
      operationId: listSessions
      description: 默认返回未归档会话（按 last_activity 倒序），读取前仅执行确定性历史状态对账；?archived=true 时返回归档列表。
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: archived
          schema:
            type: string
            enum: ["true"]
          description: 传 "true" 时读取已归档会话列表。
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: 仅 android_owner/android 写控制端可创建逻辑会话。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions/{id}/lease:
    post:
      operationId: acquireSessionLease
      description: 仅 android_owner/android 写控制端可获取当前会话的 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: current lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/snapshot:
    get:
      operationId: getSessionSnapshot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: after_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/sessions/{id}/delegations:
    get:
      operationId: listSessionDelegations
      description: 只读返回 parent Session 的 Delegation 图投影。响应只含状态、child session id、Provider 和加密摘要，不返回任务书或 child 正文。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: parent delegation graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSessionDelegation
      description: 仅 Android 写控制端可创建 proposed 节点。请求只能携带加密任务书和摘要，必须使用 parent 当前 lease_epoch；批准前不会创建 child Session。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationRequest"
      responses:
        "202":
          description: proposed delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/delegations/{id}/decision:
    post:
      operationId: decideDelegation
      description: Android 对 proposed/running 节点执行 approve、reject 或 cancel。决策使用 parent lease；approve 后 child 取得独立 lease。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationDecisionRequest"
      responses:
        "200":
          description: updated delegation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/commands:
    get:
      operationId: getSessionDaemonObservation
      description: 账号已认证客户端读取指定会话的 Daemon 安全观察投影。仅返回会话状态、命令状态/稳定错误码和裁剪后的密文封装元数据；不返回 command/terminal/lease 标识、密文、nonce、AAD、路径或 Provider 正文。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: after_seq
          description: 仅返回严格大于该会话事件序号的安全事件元数据；命令状态始终返回当前完整安全投影。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: daemon observation projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonSessionObservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: submitSessionCommand
      description: 仅 android_owner/android 写控制端可提交；lease_epoch 必须为当前正 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommandRequest"
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/readonly-transport:
    get:
      operationId: getWebReadTransport
      description: 仅 web 只读角色可获取当前 Session 绑定 Terminal 的配对公钥，用于一次性 X25519 请求密封。Relay 不返回内容密钥、工作区路径或文件元数据。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: current terminal public transport metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebReadTransport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{id}/readonly-requests:
    post:
      operationId: submitWebReadRequest
      description: 仅 web 角色可提交的一次性加密文件/Git 只读请求。Relay 根据 Session -> Workspace -> Terminal 推导目标，仅保存 opaque envelope，不能读取路径、snapshot token 或内容。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebReadRequest"
      responses:
        "202":
          description: accepted web read request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebReadReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/readonly-requests/{requestID}:
    get:
      operationId: getWebReadRequest
      description: 仅原账号 web 角色读取受限请求状态；成功后才返回浏览器临时私钥可解的 response envelope。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: requestID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: web read state and optional opaque response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebReadStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/commands/{id}:
    get:
      operationId: getCommand
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/attachments/chunks:
    post:
      operationId: uploadAttachmentChunk
      description: 仅 Android 写控制端可按序上传附件密文块。Relay 不接收文件名或附件正文，只存白名单 MIME/大小、密文元数据与密文块；请求体上限为 768 KiB。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentChunkUploadRequest"
      responses:
        "201":
          description: chunk accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/attachments/{id}/complete:
    post:
      operationId: completeAttachment
      description: 仅 Android 写控制端可幂等完成已完整上传的附件；path id 是唯一附件标识；请求体上限为 32 KiB。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCompleteRequest"
      responses:
        "200":
          description: attachment completed or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          description: attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/events:
    get:
      operationId: streamEvents
      description: 账号范围 SSE。Last-Event-ID 优先于 after_seq；两者都是 account_event_log 的跨会话单调 cursor，不能使用 session-local event_seq。客户端断线后从该 cursor 严格回放；实时 Hub 仅缩短延迟，SQLite 是恢复事实源。
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          description: 上次已处理的账号级 cursor；值必须是非负整数。
          schema:
            type: string
        - in: query
          name: after_seq
          description: Last-Event-ID 缺失时使用的账号级 cursor；名称为兼容保留，不是 session event_seq。
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/daemon/challenge:
    get:
      operationId: daemonChallenge
      description: 为已配对 terminal 签发一次性 hello challenge（ADR-012）。challenge 绑定当前 bearer 设备，5 分钟有效且只能被 signed hello 消费一次；跨 Relay 重启保持一次性语义。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: issued challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonChallengeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/daemon/hello:
    post:
      operationId: daemonHello
      description: 已配对 terminal 以设备 bearer 协商 N/N-1 协议并登记白名单 Daemon 元数据；不得包含 Workspace 绝对路径、Provider 正文或密钥。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonHelloRequest"
      responses:
        "200":
          description: negotiated terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonHelloResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          description: terminal protocol is below the supported compatibility window
  /v1/daemon/heartbeat:
    post:
      operationId: daemonHeartbeat
      description: 仅已协商的 terminal 更新在线状态；Relay 只保留 heartbeat 时间与版本摘要。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonHeartbeatRequest"
      responses:
        "200":
          description: heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonHeartbeatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          description: terminal protocol is below the supported compatibility window
  /v1/daemon/sessions/recover:
    post:
      operationId: recoverDaemonSessions
      description: 仅已配对 terminal 可调用。Daemon 进程启动后声明一次「上一进程已死亡」，Relay 据此对该 terminal 工作区遗留 running 会话做确定性收口：带 instance 或回合证据不全的置 stopped 并清空 instance，命令全终态且最后事件为 message.completed 的置 idle。绝不 archive，不要求心跳失联，幂等可重放。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonSessionRecoveryRequest"
      responses:
        "200":
          description: recovery sweep completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonSessionRecoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          description: terminal protocol is below the supported compatibility window
  /v1/daemon/commands/stream:
    get:
      operationId: streamDaemonCommands
      description: 仅目标 terminal 的专用 SSE 命令流。每个 command 均携带由 Relay 从 Session 推导的 opaque workspace_id，Daemon 必须再与本机已确认工作区匹配；不得传输 canonical_root。Last-Event-ID / after_delivery_seq 使用 terminal 范围的 delivery_seq，不能与账号级 /v1/events cursor 混用。
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - in: query
          name: after_delivery_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: daemon command SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/DaemonCommandDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/daemon/commands/{id}/ack:
    post:
      operationId: acknowledgeDaemonCommand
      description: 目标 terminal 对 received/started/rejected 的幂等确认。started 会重新校验 command 的 lease epoch、instance 与 terminal 归属。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonCommandAckRequest"
      responses:
        "200":
          description: ack state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/commands/{id}/result:
    post:
      operationId: resolveDaemonCommand
      description: 目标 terminal 回写命令终态；详细结果必须通过独立、幂等的密文 canonical event 上传，不回显 Provider 正文。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonCommandResultRequest"
      responses:
        "200":
          description: result state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/commands/{id}/workspace-result:
    post:
      operationId: resolveDaemonWorkspaceCommand
      description: workspace.create 的专用 daemon 回执。canonical_root 仅用于 Relay 内部登记 Workspace，响应不会回显路径。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonWorkspaceResultRequest"
      responses:
        "200":
          description: workspace result accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkspaceResultReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/commands/{id}/readonly-response:
    post:
      operationId: storeWebReadResponse
      description: 目标 Terminal 回写 browser 临时公钥可解的文件/Git 结果 envelope。Relay 不把该内容写入 session event 或 SSE。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonWebReadResponseRequest"
      responses:
        "200":
          description: opaque web read response stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/events:
    post:
      operationId: uploadDaemonEvent
      description: 目标 terminal 上传与命令绑定的 canonical event；Relay 只存 opaque ciphertext envelope 与白名单索引，event_id 可安全重试。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonEventUploadRequest"
      responses:
        "200":
          description: event accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonEventUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 请求体、游标或参数不符合契约。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少、失效或被重放的认证凭据。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 设备已撤销、只读或不具备当前操作所需角色。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键、租约或 bootstrap 状态冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 请求的资源不存在或不属于当前账号。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 恢复码失败次数超过冷却阈值。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: 请求体超过该接口允许的安全上限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        device_role:
          type: string
          description: 仅允许 web 或 admin；省略时服务端按 web 只读 token 处理。
          enum: [web, admin]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [account_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        device_id:
          type: string
    DeviceBoundTokenPair:
      type: object
      required: [account_id, device_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        device_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RecoveryCodeResponse:
      type: object
      required: [recovery_code]
      properties:
        recovery_code:
          type: string
    RecoveryRestoreRequest:
      type: object
      required: [recovery_code, display_name, identity_public_key, encryption_public_key]
      properties:
        email:
          type: string
          description: 兼容旧客户端；Android Happy 主路径不要求邮箱。
        recovery_code:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    RecoveryRestoreResponse:
      type: object
      required: [device, tokens]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        tokens:
          $ref: "#/components/schemas/DeviceBoundTokenPair"
    BootstrapRequest:
      type: object
      required: [display_name, identity_public_key, encryption_public_key]
      properties:
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingCreateRequest:
      type: object
      required: [role, display_name, identity_public_key, encryption_public_key]
      properties:
        role:
          type: string
          enum: [android, terminal, web]
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingRequest:
      type: object
      required: [id, status, role]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, cancelled, expired]
        role:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
        expires_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [android_owner, android, terminal, web, admin]
        status:
          type: string
          enum: [active, revoked]
        display_name:
          type: string
        platform:
          type: string
        last_seen_unix_ms:
          type: integer
          format: int64
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Terminal:
      type: object
      required: [id, device_id, status]
      properties:
        id:
          type: string
        device_id:
          type: string
        hostname:
          type: string
        platform:
          type: string
        status:
          type: string
        protocol_version:
          type: integer
          minimum: 0
        daemon_version:
          type: string
        capabilities:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 96
          description: 公开的能力名称白名单；不包含路径、命令正文或日志。
        last_seen_unix_ms:
          type: integer
          format: int64
    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/Terminal"
    UploadUsageEventRequest:
      type: object
      required: [usage_key, provider, utc_day, input_tokens, output_tokens]
      properties:
        usage_key:
          type: string
          description: Daemon 对来源事件生成的稳定去重键，Relay 只保存其哈希。
        provider:
          type: string
        session_id:
          type: string
          description: 可选会话归属，用于单会话 controls 的白名单用量投影。
        model:
          type: string
          description: 可选 Provider/model 标识；缺失时客户端必须显示 unavailable，不得推断。
        utc_day:
          type: string
          description: UTC 日桶，格式 YYYY-MM-DD。
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
          default: 0
        cache_write_tokens:
          type: integer
          minimum: 0
          default: 0
        ttft_ms:
          type: integer
          minimum: 0
          description: 可选首 token 延迟（毫秒），由 Provider timing 的 stepStart→firstToken 派生或直接上报。
        decode_throughput:
          type: number
          exclusiveMinimum: 0
          description: 可选解码吞吐 tok/s，由 output tokens / decode seconds 派生或直接上报。
    UsageEventReceipt:
      type: object
      required: [usage_key_hash, inserted]
      properties:
        usage_key_hash:
          type: string
          description: usage_key 的不可逆 SHA-256 十六进制摘要，用于幂等回执。
        inserted:
          type: boolean
          description: false 表示该 usage key 已存在（重复上传），不重复累加。
    UsageSummary:
      type: object
      required: [days, utc_today, providers, total_input_tokens, total_output_tokens]
      properties:
        days:
          type: integer
          description: 聚合窗口天数（1/7/30）。
        utc_today:
          type: string
          description: 聚合窗口结束的 UTC 日桶。
        providers:
          type: array
          items:
            $ref: "#/components/schemas/UsageDayAggregate"
        total_input_tokens:
          type: integer
        total_output_tokens:
          type: integer
    UsageDayAggregate:
      type: object
      required: [provider, utc_day, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens]
      properties:
        provider:
          type: string
        utc_day:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
    Project:
      type: object
      required: [id, fingerprint]
      properties:
        id:
          type: string
        fingerprint:
          type: string
        encrypted_name:
          type: string
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Workspace:
      type: object
      required: [id, project_id, terminal_id, origin]
      properties:
        id:
          type: string
        project_id:
          type: string
        terminal_id:
          type: string
        origin:
          type: string
          enum: [managed, dsh]
          description: 工作区来源；只有 dsh 可作为 DSH 建会话入口。
        display_name:
          type: string
          description: 经 Daemon 校验的单段项目显示名；绝不包含本机路径。
        branch:
          type: string
        status:
          type: string
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    CreateWorkspaceRequest:
      type: object
      required: [project_id, canonical_root]
      properties:
        project_id:
          type: string
        terminal_id:
          type: string
        canonical_root:
          type: string
        branch:
          type: string
        status:
          type: string
    Session:
      type: object
      required: [id, workspace_id, status]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        status:
          type: string
        last_seq:
          type: integer
          format: int64
        provider:
          type: string
        last_activity_at_unix_ms:
          type: integer
          format: int64
          description: 最后一次状态/事件写入的活动时间；0 或缺省表示旧数据未知。客户端仅用于最后消息时间展示与列表排序，不参与会话状态推断。
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    CreateSessionRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
        provider:
          type: string
    LeaseResponse:
      type: object
      required: [session_id, lease_epoch]
      properties:
        session_id:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    SessionSnapshot:
      type: object
      required: [session, events]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        events:
          type: array
          items:
            $ref: "#/components/schemas/CipherEvent"
    DaemonSessionObservation:
      type: object
      description: Flutter P2-F 只读观察投影。该资源不返回会话/命令/Terminal 的 opaque 标识，也不返回原始密文 envelope。
      required: [session, commands, events]
      properties:
        session:
          $ref: "#/components/schemas/DaemonObservationSession"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/DaemonCommandObservation"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DaemonCipherEventObservation"
    DaemonObservationSession:
      type: object
      required: [status, last_seq]
      properties:
        status:
          type: string
        provider:
          type: string
        last_seq:
          type: integer
          format: int64
          minimum: 0
    DaemonCommandObservation:
      type: object
      required: [kind, status, delivery_state]
      properties:
        kind:
          type: string
          description: 已登记命令种类；客户端未知种类必须显示通用只读占位。
        status:
          type: string
          enum: [accepted, running, succeeded, failed, cancelled, rejected, expired]
        delivery_state:
          type: string
          enum: [queued, received, started, rejected, resolved]
        error_code:
          type: string
          description: 仅协议登记的稳定错误码；未知值在 Relay 侧归一为 DAEMON_EXECUTION_FAILED。
    DaemonCipherEventObservation:
      type: object
      required: [event_seq, event_type, envelope]
      properties:
        event_seq:
          type: integer
          format: int64
          minimum: 1
        event_type:
          type: string
          enum: [session.lifecycle, turn.started, user.message, message.delta, message.completed, turn.completed, tool.call, tool.result, usage.updated, file.changed, git.snapshot, command.updated, unknown]
        terminal_status:
          type: string
          enum: [idle, stopped]
          description: 仅 turn.completed 使用的非敏感终态投影；Provider stop_reason 保留在密文 payload 内。
        envelope:
          $ref: "#/components/schemas/CipherEnvelopeMetadata"
    CipherEnvelopeMetadata:
      type: object
      description: 仅证明 Relay 已验证版本化密文封装，不包含 key_id、nonce、ciphertext、aad_hash 或任何明文。
      required: [state]
      properties:
        state:
          type: string
          enum: [verified, opaque]
        algorithm:
          type: string
          enum: [v1-aes256gcm-hkdfsha256]
        payload_version:
          type: integer
          minimum: 1
    Delegation:
      type: object
      description: parent Session 的安全 Delegation 投影。task_envelope 永不出现在此资源或事件流中。
      required: [id, parent_session_id, target_provider, status, summary_envelope, summary_envelope_sha256]
      properties:
        id:
          type: string
        parent_session_id:
          type: string
        child_session_id:
          type: string
        target_provider:
          type: string
        status:
          type: string
          enum: [proposed, approved, running, completed, failed, cancelled, rejected]
        summary_envelope:
          type: object
          description: 客户端加密摘要；Relay 不解密、不搜索。
        summary_envelope_sha256:
          type: string
    DelegationList:
      type: object
      required: [delegations]
      properties:
        delegations:
          type: array
          items:
            $ref: "#/components/schemas/Delegation"
    CreateDelegationRequest:
      type: object
      description: 任务书与摘要必须为完整加密 envelope；不得包含任务正文、路径、子会话消息或附件正文。
      required: [target_workspace_id, target_provider, task_envelope, summary_envelope, idempotency_key, lease_epoch]
      properties:
        target_workspace_id:
          type: string
        target_terminal_id:
          type: string
        target_provider:
          type: string
        task_envelope:
          type: object
        summary_envelope:
          type: object
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    DelegationDecisionRequest:
      type: object
      required: [decision, idempotency_key, lease_epoch]
      properties:
        decision:
          type: string
          enum: [approve, reject, cancel]
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    CipherEvent:
      type: object
      required: [event_seq, event_type, envelope]
      properties:
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [session.lifecycle, turn.started, user.message, message.delta, message.completed, turn.completed, tool.call, tool.result, permission.request, permission.decision, user.question, plan.changed, goal.changed, skill.catalog_changed, usage.updated, file.changed, git.snapshot, command.updated, delegation.changed]
        terminal_status:
          type: string
          enum: [idle, stopped]
          description: 仅 turn.completed 使用的非敏感终态投影；Provider stop_reason 保留在密文 payload 内。
        envelope:
          type: object
    SubmitCommandRequest:
      type: object
      required: [kind, idempotency_key, lease_epoch]
      properties:
        kind:
          type: string
          description: 仅在目标 Terminal 声明对应 capability 时投递；session.kill 仅适用于 Daemon 明确拥有的本机 Provider 进程树，不能用 session.abort 替代。
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
        target_instance_id:
          type: string
        target_terminal_id:
          type: string
        ciphertext:
          type: object
    WebReadTransport:
      type: object
      additionalProperties: false
      required: [terminal_id, workspace_id, encryption_public_key, algorithm]
      properties:
        terminal_id:
          type: string
        workspace_id:
          type: string
          description: Session 关联的 opaque Workspace ID，不是本机路径。
        encryption_public_key:
          type: string
          description: 配对 Terminal 的 X25519 公钥，不是内容密钥。
        algorithm:
          type: string
          enum: [v1-x25519-hkdfsha256-aes256gcm]
    WebReadRequest:
      type: object
      additionalProperties: false
      required: [request_id, kind, envelope]
      properties:
        request_id:
          type: string
          pattern: '^webread_[a-z0-9_-]{16,120}$'
        kind:
          type: string
          enum: [file.tree, file.read, code.read, git.status, git.changes, git.diff]
        envelope:
          $ref: "#/components/schemas/WebReadRequestEnvelope"
    WebReadRequestEnvelope:
      type: object
      additionalProperties: false
      required: [alg, payload_version, ephemeral_public_key, nonce, ciphertext, aad_hash]
      properties:
        alg:
          type: string
          enum: [v1-x25519-hkdfsha256-aes256gcm]
        payload_version:
          type: integer
          minimum: 1
        ephemeral_public_key:
          type: string
        nonce:
          type: string
        ciphertext:
          type: string
        aad_hash:
          type: string
    WebReadReceipt:
      type: object
      additionalProperties: false
      required: [request_id, kind, status]
      properties:
        request_id:
          type: string
        kind:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed, rejected]
    WebReadStatus:
      type: object
      additionalProperties: false
      required: [request_id, kind, status]
      properties:
        request_id:
          type: string
        kind:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed, rejected]
        error_code:
          type: string
        envelope:
          $ref: "#/components/schemas/WebReadResponseEnvelope"
    WebReadResponseEnvelope:
      type: object
      additionalProperties: false
      required: [alg, payload_version, nonce, ciphertext, aad_hash]
      properties:
        alg:
          type: string
          enum: [v1-x25519-hkdfsha256-aes256gcm]
        payload_version:
          type: integer
          minimum: 1
        nonce:
          type: string
        ciphertext:
          type: string
        aad_hash:
          type: string
    Command:
      type: object
      required: [id, kind, status, idempotency_key]
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          description: 0 仅用于受限 Web 只读请求；所有 Android 写控制命令必须大于 0 并通过 lease fencing。
        target_terminal_id:
          type: string
    DaemonHelloRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, daemon_version, hostname, platform, capabilities]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        daemon_version:
          type: string
          maxLength: 128
        hostname:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        capabilities:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 96
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonHelloResponse:
      type: object
      required: [terminal_id, protocol_version, min_protocol_version, heartbeat_interval_seconds, after_delivery_seq]
      properties:
        terminal_id:
          type: string
        protocol_version:
          type: integer
          minimum: 1
        min_protocol_version:
          type: integer
          minimum: 1
        heartbeat_interval_seconds:
          type: integer
          minimum: 1
        after_delivery_seq:
          type: integer
          format: int64
          minimum: 0
        auth_modes:
          type: array
          description: ADR-012 能力协商：optional 兼容窗口为 [bearer, signature_v1]；required 窗口只剩 [signature_v1]。客户端据此选择认证方式，不得自行猜测。
          items:
            type: string
            enum: [bearer, signature_v1]
    DaemonHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [protocol_version]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonSessionRecoveryRequest:
      type: object
      additionalProperties: false
      required: [protocol_version]
      description: Daemon 进程启动后的一次性历史收口声明：调用方断言同一 Terminal 的上一进程已死亡。端点幂等，重试安全。
      properties:
        protocol_version:
          type: integer
          minimum: 1
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonSessionRecoveryResponse:
      type: object
      required: [recovered_idle, recovered_stopped]
      description: 本次收口计数。收口只写 idle/stopped 与审计，绝不 archive；命令未终态的会话保持 running。
      properties:
        recovered_idle:
          type: integer
          minimum: 0
        recovered_stopped:
          type: integer
          minimum: 0
    DaemonHeartbeatResponse:
      type: object
      required: [terminal_id, server_time_unix_ms]
      properties:
        terminal_id:
          type: string
        server_time_unix_ms:
          type: integer
          format: int64
    DaemonCommandDelivery:
      type: object
      additionalProperties: false
      required: [delivery_seq, command]
      properties:
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        command:
          $ref: "#/components/schemas/DaemonDeliveredCommand"
    DaemonDeliveredCommand:
      type: object
      additionalProperties: false
      required: [id, session_id, workspace_id, kind, lease_epoch, target_terminal_id, ciphertext]
      properties:
        id:
          type: string
        session_id:
          type: string
        workspace_id:
          type: string
          description: Relay 从 Session 推导的 opaque ID；不是本机路径，也不能替代 Daemon 本机确认。
        kind:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          description: workspace.create 无会话 lease，使用 0；会话控制命令仍必须为正数。
        target_instance_id:
          type: string
        target_terminal_id:
          type: string
        ciphertext:
          type: object
    DaemonCommandAckRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, ack_kind]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        ack_kind:
          type: string
          enum: [received, started, rejected]
        error_code:
          type: string
          maxLength: 96
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonCommandResultRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, status]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [succeeded, failed, cancelled]
        error_code:
          type: string
          maxLength: 96
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonWorkspaceResultRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, workspace_id, status]
      description: workspace.create 的专用回执。canonical_root 仅由受控 Terminal 上传，Relay 只内部登记，不回传客户端。
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        workspace_id:
          type: string
          maxLength: 128
        canonical_root:
          type: string
          maxLength: 4096
          description: 成功时为本机授权根下的 canonical Git 根；失败时可省略。
        status:
          type: string
          enum: [succeeded, failed, cancelled]
        error_code:
          type: string
          maxLength: 96
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonWorkspaceResultReceipt:
      type: object
      required: [command_id, delivery_seq, workspace_id, status]
      properties:
        command_id:
          type: string
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        workspace_id:
          type: string
        status:
          type: string
          enum: [succeeded, failed, cancelled]
        error_code:
          type: string
    CreateWorkspaceWithFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9._-]+$"
          description: 授权根的直接子目录名；不允许隐藏名、dot-segment、空白或路径分隔符。
        terminal_id:
          type: string
          maxLength: 128
          description: 可选目标 Terminal；省略时由 Relay 选择账号下在线且声明 workspace_create 的 Terminal。
    WorkspaceCreateResponse:
      type: object
      required: [status, workspace_id]
      properties:
        status:
          type: string
          enum: [pending, succeeded, failed, cancelled, rejected, expired]
        command_id:
          type: string
        workspace_id:
          type: string
        error_code:
          type: string
        workspace:
          $ref: "#/components/schemas/Workspace"
    DaemonCommandReceipt:
      type: object
      required: [command_id, delivery_seq, ack_kind, status]
      properties:
        command_id:
          type: string
        delivery_seq:
          type: integer
          format: int64
        ack_kind:
          type: string
        status:
          type: string
        error_code:
          type: string
    DaemonWebReadResponseRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, envelope]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        envelope:
          $ref: "#/components/schemas/WebReadResponseEnvelope"
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonEventUploadRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, event_id, command_id, session_id, event_type, envelope]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        event_id:
          type: string
          maxLength: 128
        command_id:
          type: string
          maxLength: 128
        session_id:
          type: string
          maxLength: 128
        event_type:
          type: string
          enum: [session.lifecycle, turn.started, user.message, message.delta, message.completed, turn.completed, tool.call, tool.result, usage.updated, file.changed, git.snapshot, command.updated]
        terminal_status:
          type: string
          enum: [idle, stopped]
          description: 仅 turn.completed 使用；Relay 只接受 idle 或 stopped，Provider stop_reason 不得放入此字段。
        envelope:
          $ref: "#/components/schemas/OpaqueCipherEnvelope"
        signature:
          $ref: "#/components/schemas/TerminalSignature"
    DaemonEventUploadResponse:
      type: object
      required: [event_id, event_seq, idempotent]
      properties:
        event_id:
          type: string
        event_seq:
          type: integer
          format: int64
          minimum: 1
        idempotent:
          type: boolean
    TerminalSignature:
      type: object
      additionalProperties: false
      description: >-
        Terminal 签名认证的 additive 请求字段。canonical bytes 冻结为
        protocol_version|device_id|request_method|request_path|timestamp_ms|nonce|sha256(body)|key_id。
        body_hash 覆盖"删除顶层 signature 成员后的紧凑 UTF-8 JSON 原文字节"，两端都不得把
        signature 字段纳入哈希（否则签名覆盖自身，构成循环依赖）。hello 的 nonce 必须是
        /v1/daemon/challenge 预签发的一次性 challenge。字段在签名模式启用后由 Relay 强制校验；
        optional 兼容窗口内允许旧 bearer 客户端忽略。
      properties:
        protocol_version:
          type: integer
          minimum: 1
        key_id:
          type: string
          maxLength: 128
        timestamp_ms:
          type: integer
          format: int64
        nonce:
          type: string
          maxLength: 128
        body_hash:
          type: string
          maxLength: 128
        signature:
          type: string
          maxLength: 256
    DaemonChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge, expires_at_unix_ms]
      properties:
        challenge:
          type: string
          maxLength: 128
        expires_at_unix_ms:
          type: integer
          format: int64
    TerminalIdentityKeyRequest:
      type: object
      additionalProperties: false
      required: [identity_public_key]
      properties:
        identity_public_key:
          type: string
          maxLength: 128
          description: Ed25519 公钥（base64/base64url）；私钥永远不离开 Terminal 本机。
    TerminalIdentityKeyView:
      type: object
      additionalProperties: false
      required: [key_id, device_id, status, created_at_unix_ms]
      properties:
        key_id:
          type: string
        device_id:
          type: string
        status:
          type: string
          enum: [active, retired]
        created_at_unix_ms:
          type: integer
          format: int64
        retired_at_unix_ms:
          type: integer
          format: int64
    TerminalIdentityKeyList:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/TerminalIdentityKeyView"
    OpaqueCipherEnvelope:
      type: object
      description: Relay 不解密此对象；字段只证明其为版本化 ciphertext envelope，禁止携带明文正文、路径、prompt 或 Provider 原始响应。
      additionalProperties: true
      required: [alg, key_id, nonce, ciphertext, aad_hash, payload_version]
      properties:
        alg:
          type: string
        key_id:
          type: string
        nonce:
          type: string
        ciphertext:
          type: string
        aad_hash:
          type: string
        payload_version:
          type: integer
          minimum: 1
    AttachmentChunkUploadRequest:
      type: object
      description: 不包含 filename 或明文内容；metadata_ciphertext 与 ciphertext 均为客户端加密后的 base64 字节串。
      required: [attachment_id, session_id, mime_type, byte_size, compression, metadata_ciphertext, chunk_index, total_chunks, ciphertext, idempotency_key, lease_epoch]
      properties:
        attachment_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp, text/plain, text/markdown]
        byte_size:
          type: integer
          format: int64
          minimum: 1
        compression:
          type: string
          enum: [none, gzip]
        metadata_ciphertext:
          type: string
          format: byte
          maxLength: 21848
        chunk_index:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        ciphertext:
          type: string
          format: byte
          maxLength: 699052
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentCompleteRequest:
      type: object
      required: [session_id, total_chunks, idempotency_key, lease_epoch]
      properties:
        session_id:
          type: string
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentReceipt:
      type: object
      required: [attachment_id, chunk_index, status, idempotent]
      properties:
        attachment_id:
          type: string
        chunk_index:
          type: integer
          minimum: -1
        status:
          type: string
          enum: [pending, completed]
        idempotent:
          type: boolean
    CapabilityItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [native, emulated, unsupported]
        reason:
          type: string
        options:
          type: array
          description: Host 明确提供的安全选项目录；空值表示没有可选择项。
          items:
            type: string
        default:
          type: string
          description: 只有同时存在于 options 中的默认选项才可使用。
    CapabilityProvider:
      type: object
      required: [kind, version, available, capabilities]
      properties:
        kind:
          type: string
        version:
          type: string
        available:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityItem"
    CapabilityProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityProvider"
