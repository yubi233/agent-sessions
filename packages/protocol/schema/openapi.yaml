openapi: 3.1.0
info:
  title: Agent Sessions Internal API
  version: 1.0.0-draft
  description: 仅官方客户端使用的内部版本化 API。服务器只处理密文与白名单元数据。
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 进程存活
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: SQLite 可读写
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: not ready
  /v1/auth/register:
    post:
      operationId: register
      description: 为新账号创建初始 Android owner；成功时返回已绑定设备的令牌对。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBoundTokenPair"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/login:
    post:
      operationId: login
      description: 密码只校验账号；省略 device_role 时签发未绑定的 Web 只读令牌，禁止声明 Android 写身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices:
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/{id}:
    delete:
      operationId: revokeDevice
      description: 仅 android_owner 可撤销设备；被撤销设备的 bearer 与 refresh 均立即失效。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/bootstrap:
    post:
      operationId: bootstrapOwner
      description: 仅初始 android_owner 可写入一次本机公钥。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: owner device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests:
    post:
      operationId: createPairing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCreateRequest"
      responses:
        "201":
          description: pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/pairing/requests/{id}:
    get:
      operationId: getPairing
      description: 仅当前 Android owner 可读取；响应包含待配对设备的公开身份和加密密钥。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/requests/{id}/approve:
    post:
      operationId: approvePairing
      description: 仅 android_owner 可批准；重复批准幂等，并发批准只创建一台设备。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests/{id}/cancel:
    post:
      operationId: cancelPairing
      description: 仅当前 Android owner 可取消待处理配对请求。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/recovery-codes:
    post:
      operationId: generateRecoveryCode
      description: 仅 android_owner 可生成；恢复码明文只在此响应返回一次。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: recovery code shown once to the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/recovery-codes/restore:
    post:
      operationId: restoreRecoveryCode
      description: 无 bearer 恢复入口；恢复码一次性消费且限次，成功后撤销既有 Android 写设备。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRestoreRequest"
      responses:
        "200":
          description: recovered owner device and a new device-bound token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/terminals:
    get:
      operationId: listTerminals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: terminals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects:
    get:
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWorkspace
      description: 仅 android_owner/android 写控制端可登记 Workspace。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions:
    get:
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: 仅 android_owner/android 写控制端可创建逻辑会话。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions/{id}/lease:
    post:
      operationId: acquireSessionLease
      description: 仅 android_owner/android 写控制端可获取当前会话的 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: current lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/snapshot:
    get:
      operationId: getSessionSnapshot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: after_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/sessions/{id}/delegations:
    get:
      operationId: listSessionDelegations
      description: 只读返回 parent Session 的 Delegation 图投影。响应只含状态、child session id、Provider 和加密摘要，不返回任务书或 child 正文。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: parent delegation graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSessionDelegation
      description: 仅 Android 写控制端可创建 proposed 节点。请求只能携带加密任务书和摘要，必须使用 parent 当前 lease_epoch；批准前不会创建 child Session。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationRequest"
      responses:
        "202":
          description: proposed delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/delegations/{id}/decision:
    post:
      operationId: decideDelegation
      description: Android 对 proposed/running 节点执行 approve、reject 或 cancel。决策使用 parent lease；approve 后 child 取得独立 lease。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationDecisionRequest"
      responses:
        "200":
          description: updated delegation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/commands:
    post:
      operationId: submitSessionCommand
      description: 仅 android_owner/android 写控制端可提交；lease_epoch 必须为当前正 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommandRequest"
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/commands/{id}:
    get:
      operationId: getCommand
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/attachments/chunks:
    post:
      operationId: uploadAttachmentChunk
      description: 仅 Android 写控制端可按序上传附件密文块。Relay 不接收文件名或附件正文，只存白名单 MIME/大小、密文元数据与密文块；请求体上限为 768 KiB。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentChunkUploadRequest"
      responses:
        "201":
          description: chunk accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/attachments/{id}/complete:
    post:
      operationId: completeAttachment
      description: 仅 Android 写控制端可幂等完成已完整上传的附件；path id 是唯一附件标识；请求体上限为 32 KiB。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCompleteRequest"
      responses:
        "200":
          description: attachment completed or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          description: attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/events:
    get:
      operationId: streamEvents
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - in: query
          name: after_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/daemon/hello:
    post:
      operationId: daemonHello
      description: 已配对 terminal 以设备 bearer 协商 N/N-1 协议并登记白名单 Daemon 元数据；不得包含 Workspace 绝对路径、Provider 正文或密钥。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonHelloRequest"
      responses:
        "200":
          description: negotiated terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonHelloResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "426":
          description: terminal protocol is below the supported compatibility window
  /v1/daemon/heartbeat:
    post:
      operationId: daemonHeartbeat
      description: 仅已协商的 terminal 更新在线状态；Relay 只保留 heartbeat 时间与版本摘要。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonHeartbeatRequest"
      responses:
        "200":
          description: heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonHeartbeatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          description: terminal protocol is below the supported compatibility window
  /v1/daemon/commands/stream:
    get:
      operationId: streamDaemonCommands
      description: 仅目标 terminal 的专用 SSE 命令流。每个 command 均携带由 Relay 从 Session 推导的 opaque workspace_id，Daemon 必须再与本机已确认工作区匹配；不得传输 canonical_root。Last-Event-ID / after_delivery_seq 使用 terminal 范围的 delivery_seq，不能与账号级 /v1/events cursor 混用。
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - in: query
          name: after_delivery_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: daemon command SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/DaemonCommandDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/daemon/commands/{id}/ack:
    post:
      operationId: acknowledgeDaemonCommand
      description: 目标 terminal 对 received/started/rejected 的幂等确认。started 会重新校验 command 的 lease epoch、instance 与 terminal 归属。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonCommandAckRequest"
      responses:
        "200":
          description: ack state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/commands/{id}/result:
    post:
      operationId: resolveDaemonCommand
      description: 目标 terminal 回写命令终态；详细结果必须通过独立、幂等的密文 canonical event 上传，不回显 Provider 正文。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonCommandResultRequest"
      responses:
        "200":
          description: result state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/daemon/events:
    post:
      operationId: uploadDaemonEvent
      description: 目标 terminal 上传与命令绑定的 canonical event；Relay 只存 opaque ciphertext envelope 与白名单索引，event_id 可安全重试。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonEventUploadRequest"
      responses:
        "200":
          description: event accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonEventUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 请求体、游标或参数不符合契约。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少、失效或被重放的认证凭据。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 设备已撤销、只读或不具备当前操作所需角色。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键、租约或 bootstrap 状态冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 请求的资源不存在或不属于当前账号。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 恢复码失败次数超过冷却阈值。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: 请求体超过该接口允许的安全上限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        device_role:
          type: string
          description: 仅允许 web 或 admin；省略时服务端按 web 只读 token 处理。
          enum: [web, admin]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [account_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        device_id:
          type: string
    DeviceBoundTokenPair:
      type: object
      required: [account_id, device_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        device_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RecoveryCodeResponse:
      type: object
      required: [recovery_code]
      properties:
        recovery_code:
          type: string
    RecoveryRestoreRequest:
      type: object
      required: [email, recovery_code, display_name, identity_public_key, encryption_public_key]
      properties:
        email:
          type: string
        recovery_code:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    RecoveryRestoreResponse:
      type: object
      required: [device, tokens]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        tokens:
          $ref: "#/components/schemas/DeviceBoundTokenPair"
    BootstrapRequest:
      type: object
      required: [display_name, identity_public_key, encryption_public_key]
      properties:
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingCreateRequest:
      type: object
      required: [role, display_name, identity_public_key, encryption_public_key]
      properties:
        role:
          type: string
          enum: [android, terminal, web]
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingRequest:
      type: object
      required: [id, status, role]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, cancelled, expired]
        role:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
        expires_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [android_owner, android, terminal, web, admin]
        status:
          type: string
          enum: [active, revoked]
        display_name:
          type: string
        platform:
          type: string
        last_seen_unix_ms:
          type: integer
          format: int64
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Terminal:
      type: object
      required: [id, device_id, status]
      properties:
        id:
          type: string
        device_id:
          type: string
        hostname:
          type: string
        platform:
          type: string
        status:
          type: string
        last_seen_unix_ms:
          type: integer
          format: int64
    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/Terminal"
    Project:
      type: object
      required: [id, fingerprint]
      properties:
        id:
          type: string
        fingerprint:
          type: string
        encrypted_name:
          type: string
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Workspace:
      type: object
      required: [id, project_id, terminal_id]
      properties:
        id:
          type: string
        project_id:
          type: string
        terminal_id:
          type: string
        branch:
          type: string
        status:
          type: string
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    CreateWorkspaceRequest:
      type: object
      required: [project_id, canonical_root]
      properties:
        project_id:
          type: string
        terminal_id:
          type: string
        canonical_root:
          type: string
        branch:
          type: string
        status:
          type: string
    Session:
      type: object
      required: [id, workspace_id, status]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        status:
          type: string
        last_seq:
          type: integer
          format: int64
        provider:
          type: string
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    CreateSessionRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
        provider:
          type: string
    LeaseResponse:
      type: object
      required: [session_id, lease_epoch]
      properties:
        session_id:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    SessionSnapshot:
      type: object
      required: [session, events]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        events:
          type: array
          items:
            $ref: "#/components/schemas/CipherEvent"
    Delegation:
      type: object
      description: parent Session 的安全 Delegation 投影。task_envelope 永不出现在此资源或事件流中。
      required: [id, parent_session_id, target_provider, status, summary_envelope, summary_envelope_sha256]
      properties:
        id:
          type: string
        parent_session_id:
          type: string
        child_session_id:
          type: string
        target_provider:
          type: string
        status:
          type: string
          enum: [proposed, approved, running, completed, failed, cancelled, rejected]
        summary_envelope:
          type: object
          description: 客户端加密摘要；Relay 不解密、不搜索。
        summary_envelope_sha256:
          type: string
    DelegationList:
      type: object
      required: [delegations]
      properties:
        delegations:
          type: array
          items:
            $ref: "#/components/schemas/Delegation"
    CreateDelegationRequest:
      type: object
      description: 任务书与摘要必须为完整加密 envelope；不得包含任务正文、路径、子会话消息或附件正文。
      required: [target_workspace_id, target_provider, task_envelope, summary_envelope, idempotency_key, lease_epoch]
      properties:
        target_workspace_id:
          type: string
        target_terminal_id:
          type: string
        target_provider:
          type: string
        task_envelope:
          type: object
        summary_envelope:
          type: object
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    DelegationDecisionRequest:
      type: object
      required: [decision, idempotency_key, lease_epoch]
      properties:
        decision:
          type: string
          enum: [approve, reject, cancel]
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    CipherEvent:
      type: object
      required: [event_seq, event_type, envelope]
      properties:
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
        envelope:
          type: object
    SubmitCommandRequest:
      type: object
      required: [kind, idempotency_key, lease_epoch]
      properties:
        kind:
          type: string
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
        target_instance_id:
          type: string
        target_terminal_id:
          type: string
        ciphertext:
          type: object
    Command:
      type: object
      required: [id, kind, status, idempotency_key]
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
        target_terminal_id:
          type: string
    DaemonHelloRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, daemon_version, hostname, platform, capabilities]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        daemon_version:
          type: string
          maxLength: 128
        hostname:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        capabilities:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 96
    DaemonHelloResponse:
      type: object
      required: [terminal_id, protocol_version, min_protocol_version, heartbeat_interval_seconds, after_delivery_seq]
      properties:
        terminal_id:
          type: string
        protocol_version:
          type: integer
          minimum: 1
        min_protocol_version:
          type: integer
          minimum: 1
        heartbeat_interval_seconds:
          type: integer
          minimum: 1
        after_delivery_seq:
          type: integer
          format: int64
          minimum: 0
    DaemonHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [protocol_version]
      properties:
        protocol_version:
          type: integer
          minimum: 1
    DaemonHeartbeatResponse:
      type: object
      required: [terminal_id, server_time_unix_ms]
      properties:
        terminal_id:
          type: string
        server_time_unix_ms:
          type: integer
          format: int64
    DaemonCommandDelivery:
      type: object
      additionalProperties: false
      required: [delivery_seq, command]
      properties:
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        command:
          $ref: "#/components/schemas/DaemonDeliveredCommand"
    DaemonDeliveredCommand:
      type: object
      additionalProperties: false
      required: [id, session_id, workspace_id, kind, lease_epoch, target_terminal_id, ciphertext]
      properties:
        id:
          type: string
        session_id:
          type: string
        workspace_id:
          type: string
          description: Relay 从 Session 推导的 opaque ID；不是本机路径，也不能替代 Daemon 本机确认。
        kind:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
        target_instance_id:
          type: string
        target_terminal_id:
          type: string
        ciphertext:
          type: object
    DaemonCommandAckRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, ack_kind]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        ack_kind:
          type: string
          enum: [received, started, rejected]
        error_code:
          type: string
          maxLength: 96
    DaemonCommandResultRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, delivery_seq, status]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        delivery_seq:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [succeeded, failed, cancelled]
        error_code:
          type: string
          maxLength: 96
    DaemonCommandReceipt:
      type: object
      required: [command_id, delivery_seq, ack_kind, status]
      properties:
        command_id:
          type: string
        delivery_seq:
          type: integer
          format: int64
        ack_kind:
          type: string
        status:
          type: string
        error_code:
          type: string
    DaemonEventUploadRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, event_id, command_id, session_id, event_type, envelope]
      properties:
        protocol_version:
          type: integer
          minimum: 1
        event_id:
          type: string
          maxLength: 128
        command_id:
          type: string
          maxLength: 128
        session_id:
          type: string
          maxLength: 128
        event_type:
          type: string
          enum: [session.lifecycle, turn.started, message.delta, message.completed, tool.call, tool.result, usage.updated, file.changed, git.snapshot, command.updated]
        envelope:
          $ref: "#/components/schemas/OpaqueCipherEnvelope"
    DaemonEventUploadResponse:
      type: object
      required: [event_id, event_seq, idempotent]
      properties:
        event_id:
          type: string
        event_seq:
          type: integer
          format: int64
          minimum: 1
        idempotent:
          type: boolean
    OpaqueCipherEnvelope:
      type: object
      description: Relay 不解密此对象；字段只证明其为版本化 ciphertext envelope，禁止携带明文正文、路径、prompt 或 Provider 原始响应。
      additionalProperties: true
      required: [alg, key_id, nonce, ciphertext, aad_hash, payload_version]
      properties:
        alg:
          type: string
        key_id:
          type: string
        nonce:
          type: string
        ciphertext:
          type: string
        aad_hash:
          type: string
        payload_version:
          type: integer
          minimum: 1
    AttachmentChunkUploadRequest:
      type: object
      description: 不包含 filename 或明文内容；metadata_ciphertext 与 ciphertext 均为客户端加密后的 base64 字节串。
      required: [attachment_id, session_id, mime_type, byte_size, compression, metadata_ciphertext, chunk_index, total_chunks, ciphertext, idempotency_key, lease_epoch]
      properties:
        attachment_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp, text/plain, text/markdown]
        byte_size:
          type: integer
          format: int64
          minimum: 1
        compression:
          type: string
          enum: [none, gzip]
        metadata_ciphertext:
          type: string
          format: byte
          maxLength: 21848
        chunk_index:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        ciphertext:
          type: string
          format: byte
          maxLength: 699052
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentCompleteRequest:
      type: object
      required: [session_id, total_chunks, idempotency_key, lease_epoch]
      properties:
        session_id:
          type: string
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentReceipt:
      type: object
      required: [attachment_id, chunk_index, status, idempotent]
      properties:
        attachment_id:
          type: string
        chunk_index:
          type: integer
          minimum: -1
        status:
          type: string
          enum: [pending, completed]
        idempotent:
          type: boolean
    CapabilityItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [native, emulated, unsupported]
        reason:
          type: string
    CapabilityProvider:
      type: object
      required: [kind, version, available, capabilities]
      properties:
        kind:
          type: string
        version:
          type: string
        available:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityItem"
    CapabilityProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityProvider"
