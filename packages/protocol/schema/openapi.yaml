openapi: 3.1.0
info:
  title: Agent Sessions Internal API
  version: 1.0.0-draft
  description: 仅官方客户端使用的内部版本化 API。服务器只处理密文与白名单元数据。
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 进程存活
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: SQLite 可读写
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: not ready
  /v1/auth/register:
    post:
      operationId: register
      description: 为新账号创建初始 Android owner；成功时返回已绑定设备的令牌对。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBoundTokenPair"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/login:
    post:
      operationId: login
      description: 密码只校验账号；省略 device_role 时签发未绑定的 Web 只读令牌，禁止声明 Android 写身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices:
    get:
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/{id}:
    delete:
      operationId: revokeDevice
      description: 仅 android_owner 可撤销设备；被撤销设备的 bearer 与 refresh 均立即失效。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/bootstrap:
    post:
      operationId: bootstrapOwner
      description: 仅初始 android_owner 可写入一次本机公钥。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: owner device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests:
    post:
      operationId: createPairing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCreateRequest"
      responses:
        "201":
          description: pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/pairing/requests/{id}:
    get:
      operationId: getPairing
      description: 仅当前 Android owner 可读取；响应包含待配对设备的公开身份和加密密钥。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/pairing/requests/{id}/approve:
    post:
      operationId: approvePairing
      description: 仅 android_owner 可批准；重复批准幂等，并发批准只创建一台设备。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/pairing/requests/{id}/cancel:
    post:
      operationId: cancelPairing
      description: 仅当前 Android owner 可取消待处理配对请求。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/recovery-codes:
    post:
      operationId: generateRecoveryCode
      description: 仅 android_owner 可生成；恢复码明文只在此响应返回一次。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: recovery code shown once to the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/recovery-codes/restore:
    post:
      operationId: restoreRecoveryCode
      description: 无 bearer 恢复入口；恢复码一次性消费且限次，成功后撤销既有 Android 写设备。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRestoreRequest"
      responses:
        "200":
          description: recovered owner device and a new device-bound token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/terminals:
    get:
      operationId: listTerminals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: terminals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/projects:
    get:
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWorkspace
      description: 仅 android_owner/android 写控制端可登记 Workspace。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions:
    get:
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      description: 仅 android_owner/android 写控制端可创建逻辑会话。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sessions/{id}/lease:
    post:
      operationId: acquireSessionLease
      description: 仅 android_owner/android 写控制端可获取当前会话的 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: current lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/sessions/{id}/snapshot:
    get:
      operationId: getSessionSnapshot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: after_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/sessions/{id}/commands:
    post:
      operationId: submitSessionCommand
      description: 仅 android_owner/android 写控制端可提交；lease_epoch 必须为当前正 fencing epoch。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommandRequest"
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/commands/{id}:
    get:
      operationId: getCommand
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/attachments/chunks:
    post:
      operationId: uploadAttachmentChunk
      description: 仅 Android 写控制端可按序上传附件密文块。Relay 不接收文件名或附件正文，只存白名单 MIME/大小、密文元数据与密文块；请求体上限为 768 KiB。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentChunkUploadRequest"
      responses:
        "201":
          description: chunk accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/attachments/{id}/complete:
    post:
      operationId: completeAttachment
      description: 仅 Android 写控制端可幂等完成已完整上传的附件；path id 是唯一附件标识；请求体上限为 32 KiB。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCompleteRequest"
      responses:
        "200":
          description: attachment completed or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          description: attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/events:
    get:
      operationId: streamEvents
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - in: query
          name: after_seq
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 请求体、游标或参数不符合契约。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少、失效或被重放的认证凭据。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 设备已撤销、只读或不具备当前操作所需角色。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键、租约或 bootstrap 状态冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 恢复码失败次数超过冷却阈值。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: 请求体超过该接口允许的安全上限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        device_role:
          type: string
          description: 仅允许 web 或 admin；省略时服务端按 web 只读 token 处理。
          enum: [web, admin]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [account_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        device_id:
          type: string
    DeviceBoundTokenPair:
      type: object
      required: [account_id, device_id, access_token, refresh_token, expires_in]
      properties:
        account_id:
          type: string
        device_id:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RecoveryCodeResponse:
      type: object
      required: [recovery_code]
      properties:
        recovery_code:
          type: string
    RecoveryRestoreRequest:
      type: object
      required: [email, recovery_code, display_name, identity_public_key, encryption_public_key]
      properties:
        email:
          type: string
        recovery_code:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    RecoveryRestoreResponse:
      type: object
      required: [device, tokens]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        tokens:
          $ref: "#/components/schemas/DeviceBoundTokenPair"
    BootstrapRequest:
      type: object
      required: [display_name, identity_public_key, encryption_public_key]
      properties:
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingCreateRequest:
      type: object
      required: [role, display_name, identity_public_key, encryption_public_key]
      properties:
        role:
          type: string
          enum: [android, terminal, web]
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
    PairingRequest:
      type: object
      required: [id, status, role]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, cancelled, expired]
        role:
          type: string
        display_name:
          type: string
        identity_public_key:
          type: string
        encryption_public_key:
          type: string
        platform:
          type: string
        expires_at:
          type: string
          format: date-time
    Device:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [android_owner, android, terminal, web, admin]
        status:
          type: string
          enum: [active, revoked]
        display_name:
          type: string
        platform:
          type: string
        last_seen_unix_ms:
          type: integer
          format: int64
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Terminal:
      type: object
      required: [id, device_id, status]
      properties:
        id:
          type: string
        device_id:
          type: string
        hostname:
          type: string
        platform:
          type: string
        status:
          type: string
        last_seen_unix_ms:
          type: integer
          format: int64
    TerminalList:
      type: object
      required: [terminals]
      properties:
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/Terminal"
    Project:
      type: object
      required: [id, fingerprint]
      properties:
        id:
          type: string
        fingerprint:
          type: string
        encrypted_name:
          type: string
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Workspace:
      type: object
      required: [id, project_id, terminal_id]
      properties:
        id:
          type: string
        project_id:
          type: string
        terminal_id:
          type: string
        branch:
          type: string
        status:
          type: string
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    CreateWorkspaceRequest:
      type: object
      required: [project_id, canonical_root]
      properties:
        project_id:
          type: string
        canonical_root:
          type: string
        branch:
          type: string
        status:
          type: string
    Session:
      type: object
      required: [id, workspace_id, status]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        status:
          type: string
        last_seq:
          type: integer
          format: int64
        provider:
          type: string
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    CreateSessionRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
        provider:
          type: string
    LeaseResponse:
      type: object
      required: [session_id, lease_epoch]
      properties:
        session_id:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    SessionSnapshot:
      type: object
      required: [session, events]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        events:
          type: array
          items:
            $ref: "#/components/schemas/CipherEvent"
    CipherEvent:
      type: object
      required: [event_seq, event_type, envelope]
      properties:
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
        envelope:
          type: object
    SubmitCommandRequest:
      type: object
      required: [kind, idempotency_key, lease_epoch]
      properties:
        kind:
          type: string
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
        target_instance_id:
          type: string
        ciphertext:
          type: object
    Command:
      type: object
      required: [id, kind, status, idempotency_key]
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentChunkUploadRequest:
      type: object
      description: 不包含 filename 或明文内容；metadata_ciphertext 与 ciphertext 均为客户端加密后的 base64 字节串。
      required: [attachment_id, session_id, mime_type, byte_size, compression, metadata_ciphertext, chunk_index, total_chunks, ciphertext, idempotency_key, lease_epoch]
      properties:
        attachment_id:
          type: string
          maxLength: 128
        session_id:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp, text/plain, text/markdown]
        byte_size:
          type: integer
          format: int64
          minimum: 1
        compression:
          type: string
          enum: [none, gzip]
        metadata_ciphertext:
          type: string
          format: byte
          maxLength: 21848
        chunk_index:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        ciphertext:
          type: string
          format: byte
          maxLength: 699052
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentCompleteRequest:
      type: object
      required: [session_id, total_chunks, idempotency_key, lease_epoch]
      properties:
        session_id:
          type: string
        total_chunks:
          type: integer
          minimum: 1
          maximum: 64
        idempotency_key:
          type: string
        lease_epoch:
          type: integer
          format: int64
          minimum: 1
    AttachmentReceipt:
      type: object
      required: [attachment_id, chunk_index, status, idempotent]
      properties:
        attachment_id:
          type: string
        chunk_index:
          type: integer
          minimum: -1
        status:
          type: string
          enum: [pending, completed]
        idempotent:
          type: boolean
    CapabilityItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [native, emulated, unsupported]
        reason:
          type: string
    CapabilityProvider:
      type: object
      required: [kind, version, available, capabilities]
      properties:
        kind:
          type: string
        version:
          type: string
        available:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityItem"
    CapabilityProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityProvider"
