name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go protocol and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      # v0.9.7 阶段 1.2：把本地 task check 的三个纯静态门补进 CI——格式、
      # 文档注册表校验、协议生成物漂移（重新生成后 git diff 必须为空）。
      - name: gofmt（禁止未格式化代码）
        run: test -z "$(gofmt -l apps internal packages)"
      - name: docs_verify（测试 ID 注册表与文档回填）
        run: python3 tools/docs_verify.py
      - run: go test ./packages/... ./internal/... ./apps/relay/... -count=1

  go-race:
    name: Go race detector (relay and daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      # 竞态检测门：relay/daemon 是并发面最重的两包（SSE、outbox、看门狗、
      # presence reaper、异步 send），常规 go job 不带 -race。首次本地接入即在
      # fakeHandle 桩抓到 close(events) 与异步 emit 的真实竞争，说明该门有效。
      # -race 有 2-20x 减速，超时放宽到 30m 吸收慢机抖动。
      - run: go test -race ./internal/relay/... ./internal/daemon/... -count=1 -timeout 30m

  protocol-drift:
    name: Protocol generation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm
      # v0.9.7 阶段 1.2：与本地 task generate 同口径——重新生成 Go/TS/Dart 三份
      # 边界后必须与提交内容零差异，防止 schema 与生成物漂移（历史事故防线）。
      - run: pnpm install --frozen-lockfile
      - run: ./tools/generate_protocol.sh
      - run: git diff --exit-code -- packages/protocol/generated packages/protocol-ts apps/mobile/lib/protocol

  node:
    name: TypeScript protocol and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  flutter:
    name: Flutter protocol crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
