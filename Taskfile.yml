      - cmd: cd apps/mobile && flutter test test/session_controller_test.dart test/session_screens_test.dart test/composer_controls_test.dart test/session_workspace_create_test.dart test/http_relay_repository_test.dart --concurrency=1
      - node e2e-verify/run.mjs --suite p4-web-readonly
      - node e2e-verify/run.mjs --suite p4-admin-readonly
      - git diff --check

