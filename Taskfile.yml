    cmds:
      - node --test e2e-verify/real/dsh-v08-preflight.test.mjs
      - |
        if [[ -z "${AGENT_SESSIONS_DSH_V08_WORKSPACE_ROOTS:-}" && -z "${AGENT_SESSIONS_DSH_V08_LEGACY_ROOTS:-}" ]]; then
          echo "test:v08:preflight: local fixture passed; set AGENT_SESSIONS_DSH_V08_WORKSPACE_ROOTS or AGENT_SESSIONS_DSH_V08_LEGACY_ROOTS to run authorized inventory" >&2
          exit 0
        fi
        args=()
        if [[ -n "${AGENT_SESSIONS_DSH_V08_WORKSPACE_ROOTS:-}" ]]; then
          IFS=',' read -r -a roots <<< "$AGENT_SESSIONS_DSH_V08_WORKSPACE_ROOTS"
          for root in "${roots[@]}"; do args+=(--workspace-root "$root"); done
        fi
        if [[ -n "${AGENT_SESSIONS_DSH_V08_LEGACY_ROOTS:-}" ]]; then
          IFS=',' read -r -a roots <<< "$AGENT_SESSIONS_DSH_V08_LEGACY_ROOTS"
          for root in "${roots[@]}"; do args+=(--legacy-root "$root"); done
