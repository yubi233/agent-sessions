version: "3"

vars:
  GOPATH:
    sh: go env GOPATH
  REPORT_DIR: e2e-verify/reports

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: 静态检查、格式、schema、生成物与文档注册表
    cmds:
      - test -z "$(gofmt -l apps internal packages)"
      - python3 tools/docs_verify.py
      - test -f packages/protocol/schema/openapi.yaml
      - test -f packages/crypto/testdata/vectors.json
      - task: generate
      - pnpm typecheck

  generate:
    desc: 从 OpenAPI/JSON Schema 生成 Go、TypeScript 与 Dart 边界并检查无漂移
    cmds:
      - python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('packages/protocol/schema').glob('*.json')]"
      - |
        python3 - <<'PY'
        import hashlib
        import pathlib
        import subprocess
        import sys

        paths = [
            'packages/protocol/generated/openapi.gen.go',
            'packages/protocol-ts/src/openapi.ts',
            'apps/mobile/lib/protocol/generated.dart',
        ]

        def digest(path):
            p = pathlib.Path(path)
            return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

        before = {path: digest(path) for path in paths}
        subprocess.run(['./tools/generate_protocol.sh'], check=True)
        after = {path: digest(path) for path in paths}
        changed = [path for path in paths if before[path] != after[path]]
        if changed:
            print('Generated protocol artifacts changed after regeneration:', file=sys.stderr)
            for path in changed:
                print(f'  {path}', file=sys.stderr)
            sys.exit(1)
        PY

  test:protocol:
    desc: 协议 envelope 与错误码
    cmds:
      - go test ./packages/protocol -count=1

  test:crypto:
    desc: 跨语言加密向量
    cmds:
      - go test ./packages/crypto -count=1
      - pnpm --filter @agent-sessions/crypto test

  test:relay:
    desc: Relay 身份、会话、lease、SSE/WS
    cmds:
      - go test ./apps/relay/... ./internal/relay/... ./internal/store/... ./internal/authz/... -count=1

  test:daemon:
    desc: Daemon 生命周期、路径安全、Git
    cmds:
      - go test ./apps/daemon/... ./internal/daemon/... ./internal/gitread/... ./internal/adapter/... ./internal/workspacesafe/... -count=1

  test:daemon:process:
    desc: P2 Provider 受控进程树、session.kill 与 capability fail-closed 回归
    cmds:
      - go test ./internal/daemon -run '^(TestProcessSupervisor.*|TestSessionRunnerKill.*|TestRelayLoopRejectsMismatchedTerminalAndUndeclaredCapability)$' -count=1

  test:contract:
    desc: Adapter SPI 与四类 fixture contract
    cmds:
      - go test ./internal/adapter/... -count=1

  test:e2e:relay:
    desc: P2 本地 Relay-Daemon fixture 闭环（命令、SSE、只读 Workspace 与密文事件边界）
    cmds:
      - go test ./internal/relay -run '^(TestP2DaemonCommandLifecycleAndSSERecovery|TestP2DaemonRejectsStaleLeaseBeforeStart|TestP2DaemonProtocolAndRevocationFailClosed|TestP2FlutterDaemonObservationReadOnly|TestP2RelayDaemonDeterministicFullLoop|TestP2RelayDaemonDeterministicSessionLifecycleFullLoop|TestP2RelayDaemonRestart.*|TestP2ReadOnlyWorkspaceCommandStaysOpaqueAcrossRelay)$' -count=1

  test:e2e:web:
    desc: P4 Web SSE cursor 的 headed Chrome 本地 fixture 旅程
    cmds:
      - node e2e-verify/run.mjs --suite p4-web-readonly

  test:e2e:web-read-transport:
    desc: P4-D Web-Daemon 加密文件/Git 的 headed Chrome 本地旅程
    cmds:
      - node e2e-verify/run.mjs --suite p4-web-read-transport

  test:v04:p4d:
    desc: v0.4 P4-D Web-Daemon 加密只读传输 full gate
    cmds:
      - task: docs:verify
      - task: check
      - go test ./internal/daemon -run WebRead -count=1
      - go test ./internal/relay -run WebRead -count=1
      - pnpm --filter @agent-sessions/web test
      - task: test:e2e:web-read-transport
      - git diff --check

  test:v04:p4:
    desc: v0.4 P4 Web SSE cursor、只读快照与 headed Chrome full gate
    cmds:
      - task: docs:verify
      - task: check
      - go test ./internal/relay -run '^(TestP4AccountSSECursorRecoveryAndIsolation|TestP4AccountSSEPublishesCommittedDelegationEvent|TestP4AccountSSECORSAllowsLastEventID)$' -count=1
      - pnpm --filter @agent-sessions/web test
      - task: test:e2e:web
      - git diff --check

  test:v04:p2:
    desc: v0.4 P2 协议、Relay-Daemon 和只读 Workspace 本地 full gate
    cmds:
      - task: docs:verify
      - task: check
      - task: test:protocol
      - task: test:relay
      - task: test:daemon:process
      - task: test:daemon
      - go test ./internal/domain -count=1
      - task: test:contract
      - task: test:e2e:relay
      - git diff --check

  test:mobile:p2f:
    desc: P2-F Flutter Daemon 安全观察定向回归
    dir: apps/mobile
    cmds:
      - dart format --set-exit-if-changed lib/domain/daemon_observation_models.dart lib/state/daemon_observation_controller.dart lib/ui/daemon_observation_screens.dart test/daemon_observation_test.dart test/http_relay_repository_test.dart
      - flutter test test/daemon_observation_test.dart test/http_relay_repository_test.dart --concurrency=1

  test:v04:p2f:
    desc: v0.4 P2-F Relay 安全观察契约与 Flutter 最小可见衔接 gate
    cmds:
      - task: docs:verify
      - task: check
      - go test ./internal/domain ./internal/httpapi ./packages/protocol -count=1
      - task: test:e2e:relay
      - task: test:mobile:p2f
      - git diff --check

  test:v04:perf:
    desc: PERF-04 固定样本的本地命令、事件与 Hub 背压基线
    cmds:
      - node e2e-verify/perf/v04-baseline.mjs

  test:v04:local:
    desc: v0.4 本地 full gate（不隐式运行 Android、真实 Provider 或真实模型）
    cmds:
      - task: docs:verify
      - task: check
      - task: test
      - task: test:e2e:relay
      - task: test:android
      - task: test:v04:perf
      - task: test:e2e:harness
      - node e2e-verify/run.mjs --suite p1-design-system
      - node e2e-verify/run.mjs --suite p4-web-readonly
      - node e2e-verify/run.mjs --suite p4-web-read-transport
      - node e2e-verify/run.mjs --suite p4-admin-readonly
      - task: test:flutter:local
      - task: test:deploy
      - task: test:restart
      - git diff --check

  test:
    desc: 单元与集成回归
    cmds:
      - task: test:protocol
      - task: test:crypto
      - task: test:relay
      - task: test:daemon
      - pnpm -r --if-present test

  test:e2e:
    desc: headed Web/Admin 浏览器回归
    cmds:
      - task: test:e2e:harness
      - pnpm --filter @agent-sessions/e2e-verify test:e2e

  test:e2e:harness:
    desc: headed E2E runner 的生命周期、隔离端口与外部凭据阻塞分类回归
    cmds:
      - node --test e2e-verify/suites/p5-opencode-capabilities.test.mjs e2e-verify/suites/relay-isolation.test.mjs

  test:record:
    desc: headed 录屏演示，必须在回归清单通过后执行
    cmds:
      - node e2e-verify/record.mjs

  test:real:
    desc: 经授权的 OpenCode Go 真实模型 gate（默认 deepseek-v4-flash）
    cmds:
      - node e2e-verify/real/opencode-live.test.mjs
      - node e2e-verify/real/opencode-live.mjs {{.CLI_ARGS}}

  test:real:codex:
    desc: 经授权的 Codex app-server live smoke（ADPT-CODEX-04，需 AGENT_SESSIONS_CODEX_LIVE_SMOKE=1）
    cmds:
      - AGENT_SESSIONS_CODEX_LIVE_SMOKE=1 go test ./internal/adapter/codex/ -run TestCodexLiveSmoke -v -count=1

  test:android:
    desc: Flutter 分析与 widget 测试（单 worker，规避当前 macOS Flutter listener 清理竞态）
    cmds:
      - flutter analyze
      - flutter test --machine --concurrency=1
    dir: apps/mobile

  test:flutter:local:
    desc: MacBook 本地 Flutter macOS 可见桌面窗口 P1-P6 验收
    cmds:
      - node e2e-verify/mobile/macos.test.mjs
      - node e2e-verify/mobile/macos-screenshot.test.mjs
      - node e2e-verify/mobile/run-macos.mjs {{.CLI_ARGS}}

  test:flutter:record:
    desc: 已通过 Flutter macOS full gate 后的严格 5fps fixture 录屏（不少于 300 候选帧筛选 100 连续最终帧）
    cmds:
      - node e2e-verify/mobile/record-macos.test.mjs
      - node e2e-verify/mobile/record-macos.mjs {{.CLI_ARGS}}

  test:android:harness:
    desc: Android AVD 与物理设备回归编排器的纯 Node 回归
    cmds:
      - node --test e2e-verify/mobile/android.test.mjs
      - node --test e2e-verify/mobile/android-device.test.mjs

  test:android:e2e:
    desc: 后续 Android AVD integration diagnostic（不属于本轮 v0.1 gate）
    cmds:
      - task: test:android:harness
      - node e2e-verify/mobile/run-android.mjs {{.CLI_ARGS}}

  test:android:device:
    desc: 已连接并授权的物理 Android 设备 integration gate
    cmds:
      - task: test:android:harness
      - node e2e-verify/mobile/run-android-device.mjs {{.CLI_ARGS}}

  docs:verify:
    cmds:
      - python3 tools/docs_verify.py

  test:v04:p0:
    desc: v0.4 P0 文档、生成物与格式门禁
    cmds:
      - task: check
      - git diff --check

  compose:up:
    desc: 启动本机 Relay（SQLite，不依赖 Docker）
    cmds:
      - ./tools/relayctl.sh up

  test:restart:
    desc: restart.sh 本地生命周期、幂等和进程清理回归
    cmds:
      - bash tools/restart_test.sh

  dev:start:
    desc: 启动 Relay、Daemon、Flutter 本地开发主流程（可传 restart.sh 参数）
    cmds:
      - ./restart.sh restart {{.CLI_ARGS}}

  dev:stop:
    desc: 停止本脚本拥有的本地开发进程
    cmds:
      - ./restart.sh stop {{.CLI_ARGS}}

  dev:status:
    desc: 查看 Relay、Daemon、Flutter、Web、Admin 的 PID/状态/日志
    cmds:
      - ./restart.sh status {{.CLI_ARGS}}

  compose:down:
    desc: 停止本轮 Relay
    cmds:
      - ./tools/relayctl.sh down

  test:deploy:
    desc: 灾备与安全门禁（备份/恢复/完整性/明文泄漏扫描）
    cmds:
      - go test ./internal/deploy/... ./internal/securityscan/... -count=1
      - go run ./apps/deployctl scan -root .
      - go run ./apps/deployctl integrity -db ./data/relay.db

  deploy:backup:
    desc: 备份 SQLite 权威库
    cmds:
      - go run ./apps/deployctl backup -src ./data/relay.db -dst ./data/backups/relay-{{.NOW}}.db
    vars:
      NOW:
        sh: date +%Y%m%dT%H%M%S

  deploy:restore:
    desc: 从备份恢复并校验完整性
    cmds:
      - go run ./apps/deployctl restore -backup {{.CLI_ARGS}} -to ./data/relay-restored.db

  deploy:scan:
    desc: 明文泄漏扫描门禁
    cmds:
      - go run ./apps/deployctl scan -root .

  toolchain:
    desc: 输出锁定工具版本
    cmds:
      - go version
      - node -v
      - pnpm -v
      - flutter --version
      - python3 --version
