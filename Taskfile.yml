version: "3"

vars:
  GOPATH:
    sh: go env GOPATH
  REPORT_DIR: e2e-verify/reports

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: 静态检查、格式、schema、生成物与文档注册表
    cmds:
      - test -z "$(gofmt -l apps internal packages)"
      - python3 tools/docs_verify.py
      - test -f packages/protocol/schema/openapi.yaml
      - test -f packages/crypto/testdata/vectors.json
      - task: generate
      - pnpm typecheck

  generate:
    desc: 从 OpenAPI/JSON Schema 生成 Go、TypeScript 与 Dart 边界并检查无漂移
    cmds:
      - python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('packages/protocol/schema').glob('*.json')]"
      - ./tools/generate_protocol.sh
      - git diff --exit-code -- packages/protocol/generated packages/protocol-ts/src/openapi.ts apps/mobile/lib/protocol/generated.dart

  test:protocol:
    desc: 协议 envelope 与错误码
    cmds:
      - go test ./packages/protocol -count=1

  test:crypto:
    desc: 跨语言加密向量
    cmds:
      - go test ./packages/crypto -count=1
      - pnpm --filter @agent-sessions/crypto test

  test:relay:
    desc: Relay 身份、会话、lease、SSE/WS
    cmds:
      - go test ./apps/relay/... ./internal/relay/... ./internal/store/... ./internal/authz/... -count=1

  test:daemon:
    desc: Daemon 生命周期、路径安全、Git
    cmds:
      - go test ./apps/daemon/... ./internal/daemon/... ./internal/gitread/... ./internal/adapter/... ./internal/workspacesafe/... -count=1

  test:contract:
    desc: Adapter SPI 与四类 fixture contract
    cmds:
      - go test ./internal/adapter/... -count=1

  test:e2e:relay:
    desc: P2 本地 Relay-Daemon fixture 闭环（命令、SSE、只读 Workspace 与密文事件边界）
    cmds:
      - go test ./internal/relay -run '^(TestP2DaemonCommandLifecycleAndSSERecovery|TestP2DaemonRejectsStaleLeaseBeforeStart|TestP2DaemonProtocolAndRevocationFailClosed|TestP2RelayDaemonDeterministicFullLoop|TestP2ReadOnlyWorkspaceCommandStaysOpaqueAcrossRelay)$' -count=1

  test:v04:p2:
    desc: v0.4 P2 协议、Relay-Daemon 和只读 Workspace 本地 full gate
    cmds:
      - task: docs:verify
      - task: check
      - task: test:protocol
      - task: test:relay
      - task: test:daemon
      - go test ./internal/domain -count=1
      - task: test:contract
      - task: test:e2e:relay
      - git diff --check

  test:
    desc: 单元与集成回归
    cmds:
      - task: test:protocol
      - task: test:crypto
      - task: test:relay
      - task: test:daemon
      - pnpm -r --if-present test

  test:e2e:
    desc: headed Web/Admin 浏览器回归
    cmds:
      - pnpm --filter @agent-sessions/e2e-verify test:e2e

  test:record:
    desc: headed 录屏演示，必须在回归清单通过后执行
    cmds:
      - node e2e-verify/record.mjs

  test:real:
    desc: 经授权的 OpenCode Go 真实模型 gate（默认 deepseek-v4-flash）
    cmds:
      - node e2e-verify/real/opencode-live.test.mjs
      - node e2e-verify/real/opencode-live.mjs {{.CLI_ARGS}}

  test:android:
    desc: Flutter 分析与 widget 测试（单 worker，规避当前 macOS Flutter listener 清理竞态）
    cmds:
      - flutter analyze
      - flutter test --machine --concurrency=1
    dir: apps/mobile

  test:flutter:local:
    desc: MacBook 本地 Flutter macOS 可见桌面窗口 P1-P6 验收
    cmds:
      - node e2e-verify/mobile/macos.test.mjs
      - node e2e-verify/mobile/macos-screenshot.test.mjs
      - node e2e-verify/mobile/run-macos.mjs {{.CLI_ARGS}}

  test:flutter:record:
    desc: 已通过 Flutter macOS full gate 后的 P6 5fps fixture 录屏
    cmds:
      - node e2e-verify/mobile/record-macos.test.mjs
      - node e2e-verify/mobile/record-macos.mjs {{.CLI_ARGS}}

  test:android:harness:
    desc: 后续 Android AVD 回归编排器的纯 Node 回归
    cmds:
      - node --test e2e-verify/mobile/android.test.mjs

  test:android:e2e:
    desc: 后续 Android AVD integration diagnostic（不属于本轮 v0.1 gate）
    cmds:
      - task: test:android:harness
      - node e2e-verify/mobile/run-android.mjs {{.CLI_ARGS}}

  docs:verify:
    cmds:
      - python3 tools/docs_verify.py

  test:v04:p0:
    desc: v0.4 P0 文档、生成物与格式门禁
    cmds:
      - task: check
      - git diff --check

  compose:up:
    desc: 启动本机 Relay（SQLite，不依赖 Docker）
    cmds:
      - ./tools/relayctl.sh up

  compose:down:
    desc: 停止本轮 Relay
    cmds:
      - ./tools/relayctl.sh down

  test:deploy:
    desc: 灾备与安全门禁（备份/恢复/完整性/明文泄漏扫描）
    cmds:
      - go test ./internal/deploy/... ./internal/securityscan/... -count=1
      - go run ./apps/deployctl scan -root .
      - go run ./apps/deployctl integrity -db ./data/relay.db

  deploy:backup:
    desc: 备份 SQLite 权威库
    cmds:
      - go run ./apps/deployctl backup -src ./data/relay.db -dst ./data/backups/relay-{{.NOW}}.db
    vars:
      NOW:
        sh: date +%Y%m%dT%H%M%S

  deploy:restore:
    desc: 从备份恢复并校验完整性
    cmds:
      - go run ./apps/deployctl restore -backup {{.CLI_ARGS}} -to ./data/relay-restored.db

  deploy:scan:
    desc: 明文泄漏扫描门禁
    cmds:
      - go run ./apps/deployctl scan -root .

  toolchain:
    desc: 输出锁定工具版本
    cmds:
      - go version
      - node -v
      - pnpm -v
      - flutter --version
      - python3 --version
