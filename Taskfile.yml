version: "3"

vars:
  GOPATH:
    sh: go env GOPATH
  REPORT_DIR: e2e-verify/reports

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: 静态检查、格式、schema、生成物与文档注册表
    cmds:
      - test -z "$(gofmt -l apps internal packages)"
      - python3 tools/docs_verify.py
      - test -f packages/protocol/schema/openapi.yaml
      - test -f packages/crypto/testdata/vectors.json
      - task: generate
      - pnpm typecheck

  generate:
    desc: 从 OpenAPI/JSON Schema 生成 Go、TypeScript 与 Dart 边界并检查无漂移
    cmds:
      - python3 -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('packages/protocol/schema').glob('*.json')]"
      - |
        python3 - <<'PY'
        import hashlib
        import pathlib
        import subprocess
        import sys

        paths = [
            'packages/protocol/generated/openapi.gen.go',
            'packages/protocol-ts/src/openapi.ts',
            'apps/mobile/lib/protocol/generated.dart',
        ]

        def digest(path):
            p = pathlib.Path(path)
            return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

        before = {path: digest(path) for path in paths}
        subprocess.run(['./tools/generate_protocol.sh'], check=True)
        after = {path: digest(path) for path in paths}
        changed = [path for path in paths if before[path] != after[path]]
        if changed:
            print('Generated protocol artifacts changed after regeneration:', file=sys.stderr)
            for path in changed:
                print(f'  {path}', file=sys.stderr)
            sys.exit(1)
        PY

  test:protocol:
    desc: 协议 envelope 与错误码
    cmds:
      - go test ./packages/protocol -count=1

  test:crypto:
    desc: 跨语言加密向量
    cmds:
      - go test ./packages/crypto -count=1
      - pnpm --filter @agent-sessions/crypto test

  test:relay:
    desc: Relay 身份、会话、lease、SSE/WS
    cmds:
      - go test ./apps/relay/... ./internal/relay/... ./internal/store/... ./internal/authz/... -count=1

  test:daemon:
    desc: Daemon 生命周期、路径安全、Git
    cmds:
      - go test ./apps/daemon/... ./internal/daemon/... ./internal/gitread/... ./internal/adapter/... ./internal/workspacesafe/... -count=1

  test:daemon:process:
    desc: P2 Provider 受控进程树、session.kill 与 capability fail-closed 回归
    cmds:
      - go test ./internal/daemon -run '^(TestProcessSupervisor.*|TestSessionRunnerKill.*|TestRelayLoopRejectsMismatchedTerminalAndUndeclaredCapability)$' -count=1

  test:contract:
    desc: Adapter SPI 与四类 fixture contract
    cmds:
      - go test ./internal/adapter/... -count=1

  test:e2e:relay:
    desc: P2 本地 Relay-Daemon fixture 闭环（命令、SSE、只读 Workspace 与密文事件边界）+ v0.6 签名认证纵向回归 + P4 生产客户端签名闭环、签名私钥接线纵向与回滚演练
    cmds:
      - go test ./internal/relay -run '^(TestP2DaemonCommandLifecycleAndSSERecovery|TestP2DaemonRejectsStaleLeaseBeforeStart|TestP2DaemonProtocolAndRevocationFailClosed|TestP2FlutterDaemonObservationReadOnly|TestP2RelayDaemonDeterministicFullLoop|TestP2RelayDaemonDeterministicSessionLifecycleFullLoop|TestP2RelayDaemonRestart.*|TestP2ReadOnlyWorkspaceCommandStaysOpaqueAcrossRelay|TestV06SignedTerminalFullLoop|TestV06RequiredModeRejectsLegacyBearer|TestV06SignedTerminalRevocationFailClosed|TestV06DaemonClientSignedProductionLoop|TestV06DaemonSignerLoaderProductionWiring|TestV06SignatureModeRollbackDrill)$' -count=1

  test:v06:
    desc: v0.6 发布门统一入口（P4 计划 §6：文档校验、静态检查、协议/加密/Relay/Daemon/纵向回归、Adapter 契约、soak、灾备、restart 与 headed 浏览器面）
    cmds:
      - task: docs:verify
      - task: check
      - task: test:protocol
      - task: test:crypto
      - task: test:relay
      - task: test:daemon
      - task: test:e2e:relay
      - task: test:contract
      - task: test:v06:soak
      - task: test:deploy
      - task: test:restart
      - node e2e-verify/run.mjs --suite p4-web-readonly
      - node e2e-verify/run.mjs --suite p4-admin-readonly

  test:v07:local:
