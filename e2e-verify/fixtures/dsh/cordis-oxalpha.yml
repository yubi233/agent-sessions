# ACP 自动化服务与后端快照记录组合。设置 `DSH_SNAPSHOT=record` 后，应用二进制
# 运行真实 DeepSeek 适配器，测试工具收集其持久化日志。二进制会在加载本配置前
# 读取被 git 忽略的根目录 `.env`。本组合不启用 stdout 日志器或 HMR，因为 stdout
# 承载 ACP JSON-RPC。
# 文件名保留历史兼容路径；原默认模型已下线，快照改用仍受支持的模型。

# Zen 路由使用通用 pi-ai 适配器；凭据只引用环境变量，不把密钥写入 fixture。
- id: llm
  name: '/Users/yubi/code/deepseek-harness/packages/llm/llm-pi-ai/lib/index.js'
  config:
    providers:
      opencode-zen:
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        retryPolicy:
          mode: normal
          maxRetries: 5
        models:
          - id: nemotron-3-ultra-free
            input:
              - text
          - id: nemotron-3.5-lightning-free
            input:
              - text
          - id: ling-3.0-flash-fin-free
            input:
              - text
          - id: mimo-v2.5-free
            input:
              - text

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'


# 默认组合把 bash 和文件系统工具限制在工作区内，扩大范围前需要确认。快照运行选择
# danger-full-access，使既有场景不依赖 Runner；快照工具之外也可用 DSH_PERMISSION_MODE
# 提供同样明确的部署/测试覆盖。沙箱默认值和回退根位于 ctx.sandboxPolicy，Agent 调用
# 会以会话 cwd 解析这两类边界。
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js "process.env.DSH_SESSION_CWD ?? process.cwd()"

# bash 执行器使用的受控子进程组（负责创建、终止和输出处理）。
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

# ACP 自动化应用：Agent 主干、JSONL 持久化和协议桥。
# 持久化根：快照工具设置 `$DSH_SNAPSHOT_SESSIONS_ROOT` 时使用该隔离目录，
# 否则使用当前工作区的 `.dsh-sessions`。快照模式使用原始 JSONL，普通运行使用压缩格式。
- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: opencode-zen
    model: nemotron-3-ultra-free
    persistenceRoot: !!js "process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? (process.cwd() + '/.dsh-sessions')"
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT_COMPRESSION ?? (process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none')"
    workspaceContext:
      maxBytes: 65536
    # persona 只保留身份和行为，工具插件负责工具说明；循环会解析 {{model}} 和
    # ACP 会话传入的 {{cwd}}。
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

# 感知回放的请求压力控制；路由适配器提供模型容量。
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# 在测得压力或 Provider 明确发生上下文溢出后，压缩较早的消息范围；比例按路由模型
# 的上下文窗口缩放。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# 投影注册表：子 Agent 目录身份（模式/标签）通过已注册单元汇总；缺少能力时，目录
# 入口（`list_agents`、子 Agent 列表）明确失败。
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# 通过不同工具名称暴露新子级 `spawn` 和已完成前缀 `fork`，让多子级场景覆盖两种
# 传输。这些叶子插件跟随应用加载，因为应用提供 `ctx.agents` 和 `ctx.tools`。
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

# 可继续的后台子级按委派工具选择。单独加载的控制包注册全局 `send_message`，其列表
# 插件注册 `list_agents`，并通过上方挂载的 sessionProjections 注册表提供；`report`
# 只安装在可继续的子级作用域。
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork 保持一次性执行，因为可继续子级的 `report` 工具和 prompt 段会排在 fork 复用的
# 继承历史之前；即使 agent-spine-demo 挂载通用 Job 运行时，也明确关闭
# `run_in_background`，只允许前台执行。参见
# .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md。
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1


# worker-thread 工作流引擎通过 spawn 后端分发模型编写的 JavaScript 脚本中的
# `agent()` 调用；相邻工具将该能力暴露给模型。
- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'
# `todo_write` 会替换记录中的完整列表，供后续模型请求使用。
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 相同的重复调用在默认阈值 [3, 5, 8] 触发提示上下文，不会阻断请求；只有
# repeat-tool-reminder 快照场景会达到这些阈值。
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'

# 文件系统栈与 bash 使用同一份沙箱策略：dsh-fs-sandbox 在 ctx.fs 后替代 dsh-fs-local，
# 按生效模式限制写入/编辑（只读拒绝，workspace-write 限制在工作区和临时根，
# danger-full-access 直接放行），因此所有模式都提供读/写/编辑。fs-observation-policy
#（编辑前读取）在此基础上正交组合。
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `configPath` 只在加载时读取，并从服务启动 cwd 解析，不使用 `session/new.cwd`；因此
# 一个 `hooks.json` 会作用于所有会话，也不会发现项目本地文件。配置缺失时不注册任何
# 内容。Hook 命令仍在会话 cwd 执行，警告写入 `ctx.logger`，绝不写 stdout；按会话设计
# 的延后方案见 packages/hooks/hooks-claude-code/README.md。
- id: hooks-claude-code
  name: '@deepseek-ai/dsh-hooks-claude-code'
  config:
    configPath: ./hooks.json

# Codex 使用自己的 `codex-hooks.json` 和 snake_case 五事件方言，不能与 Claude 共用
# 文件。它同样遵循进程级、只读一次、缺失即不操作、仅写 logger 的契约。两个桥同时
# 随包提供，场景可以分别初始化并验证两种方言。
- id: hooks-codex
  name: '@deepseek-ai/dsh-hooks-codex'
  config:
    configPath: ./codex-hooks.json
