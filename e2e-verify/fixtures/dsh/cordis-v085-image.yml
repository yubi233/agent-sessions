# v0.8.5 图片成功路径 deterministic overlay（V085-05 / P4）：
# 在生产 acp-demo 组合挂载 attachment-local（服务 id=attachments）+ image 输入模型
# 目录，以可脚本化 mock LLM（@deepseek-ai/dsh-llm-mock-server）驱动真实桥的图片
# admission 正向旅程——全程不调用真实模型（real_model=false）：
#   promptCapabilities.image=true（attachment 服务 + image 模型目录双条件）；
#   session/prompt 携带 ACP image block → 桥 admitAcpPrompt 放行 → mock 回包；
#   模型侧收包不含 image 的失败/回滚路径不在此组合（对照=生产 cordis.yml text-only）。
# mock LLM 由 overlay 脚本拉起并注入 V085_MOCK_BASE_URL；API key 校验关闭。
# 凭据只经 DSH 根 .env / 环境变量引用，不写入本文件。

- id: llm
  name: '/Users/yubi/code/deepseek-harness/packages/llm/llm-pi-ai/lib/index.js'
  config:
    providers:
      mock-v085:
        apiKeyEnv: V085_MOCK_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.V085_MOCK_BASE_URL ?? 'http://127.0.0.1:18585/v1'"
        models:
          # 图片 capable 路由：模型目录必须声明 image 输入，否则桥如实返回
          # promptCapabilities.image=false（不伪造能力）。
          - id: mock-image
            name: Mock Image
            contextWindow: 128000
            maxTokens: 8000
            input:
              - text
              - image

- id: sandbox
  name: '/Users/yubi/code/deepseek-harness/packages/sandbox/sandbox-local/lib/index.js'

- id: sandbox-policy
  name: '/Users/yubi/code/deepseek-harness/packages/sandbox/sandbox-policy/lib/index.js'
  config:
    mode: danger-full-access
    workspaceRoot: !!js "process.env.DSH_SESSION_CWD ?? process.cwd()"

- id: subprocess
  name: '/Users/yubi/code/deepseek-harness/packages/subprocess/subprocess-local/lib/index.js'

- id: bash
  name: '/Users/yubi/code/deepseek-harness/packages/shell/bash-sandbox/lib/index.js'
  config:
    timeoutMs: 60000

- id: approval
  name: '/Users/yubi/code/deepseek-harness/packages/interaction/user-approval/lib/index.js'
  config:
    policy: ask

# attachment 服务：服务 id 固定为 attachments（桥 supportsAcpImagePrompts 读取）。
# 存储根由测试显式注入，不落在用户 ~/.dsh。
- id: attachments
  name: '/Users/yubi/code/deepseek-harness/packages/attachment/attachment-local/lib/index.js'
  config:
    dshHome: !!js "process.env.AGENT_SESSIONS_DSH_ATTACHMENT_HOME ?? ((process.env.TMPDIR ?? '/tmp') + '/agent-sessions-dsh-attachments-v085')"

- id: user-questions
  name: '/Users/yubi/code/deepseek-harness/packages/interaction/user-questions/lib/index.js'
- id: fs-sandbox
  name: '/Users/yubi/code/deepseek-harness/packages/fs/fs-sandbox/lib/index.js'
- id: token-meter
  name: '/Users/yubi/code/deepseek-harness/packages/llm/token-meter/lib/index.js'
- id: commands
  name: '/Users/yubi/code/deepseek-harness/packages/interaction/commands/lib/index.js'
- id: compaction
  name: '/Users/yubi/code/deepseek-harness/packages/compaction/compaction/lib/index.js'

- id: agent-presets
  name: '/Users/yubi/code/deepseek-harness/packages/preset/agent-presets/lib/index.js'
  config:
    default: standard
    includeUserRoot: false
    roots:
      - path: '/Users/yubi/code/deepseek-harness/apps/cli/config/agent-presets'
        trust: system

- id: acp-agent
  name: '/Users/yubi/code/deepseek-harness/packages/examples/acp-demo/lib/index.js'
  config:
    provider: mock-v085
    model: mock-image
    modelProviders:
      mock-image: mock-v085
    toolUpdates: true
    ignoreMcpServers: true
    persistenceRoot: !!js "process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? (process.cwd() + '/.dsh-sessions')"
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT_COMPRESSION ?? 'none'"
    workspaceContext:
      maxBytes: 65536

- id: permission
  name: '/Users/yubi/code/deepseek-harness/packages/interaction/permission-presets/lib/index.js'
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
